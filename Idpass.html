<!-- idpass.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Username and Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .idpass-container {
            text-align: center;
            background: #f5f5f5;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            color: #4CAF50;
        }
        .details {
            margin: 15px 0;
            padding: 10px;
            background: #fafafa;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 18px;
        }
        .copy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .back-btn {
            background: #FF6347;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="idpass-container">
        <h2>USERNAME PASS</h2>

        <div class="details">
            <strong>USERNAME:</strong> ALYAN-HACKER
            <button class="copy-btn" onclick="copyText('username')">Copy</button>
        </div>

        <div class="details">
            <strong>PASS:</strong> N.A.EHACKER234#$@
            <button class="copy-btn" onclick="copyText('password')">Copy</button>
        </div>

        <button class="back-btn" onclick="window.location.href='index.html'">Back to Login</button>
    </div>

    <script>
        function copyText(type) {
            let value = (type === 'username') 
                ? 'ALYAN-HACKER' 
                : 'N.A.EHACKER234#$@';

            const textArea = document.createElement("textarea");
            textArea.value = value;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            alert(type.toUpperCase() + " Copied!");
        }
    </script>
</body>
</html>
